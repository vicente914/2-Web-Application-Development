<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoWorld - Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header>
        <h1>TecnoWorld</h1>
        <p>Contacta con nosotros</p>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="tecnologia.html">Tecnología</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main>

        <section class="contacto">
            <h2>Contacto</h2>

            <p>
                ¿Tienes alguna pregunta o quieres proponernos
                un tema? Puedes utilizar el siguiente formulario.
            </p>

            <form>

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email">

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="6"></textarea>

                <button type="submit">Enviar mensaje</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 TecnoWorld</p>
    </footer>

</body>
</html>
